# Local development services. Production stack lives in deploy/.
name: okane

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: okane
      POSTGRES_PASSWORD: okane
      POSTGRES_DB: okane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okane -d okane"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
